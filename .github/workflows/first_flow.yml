name: Run tests on Linux

on: 
    push:
      branches:
        - main

    pull_request:
      branches:
        - main

    workflow_dispatch:

    schedule:
      - cron: '30 5 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
            python-version: "3.12"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Allure
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz
          tar -zxvf allure-2.34.1.tgz
          sudo mv allure-2.34.1 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      - name: Install dependencies
        run: |
            pip install selenium
            pip install pytest
            pip install allure-pytest
      
      - name: Restore Allure history
        uses: actions/cache/restore@v4
        with:
          path: allure-report/history
          key: allure-history-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys:
            allure-history-${{ github.ref_name }}-
      
      - name: Prepare Allure history
        run: |
          if [ -d "allure-report/history" ]; then
            mkdir -p allure-results/history
            cp -R allure-report/history/. allure-results/history/
          fi
      
      - name: Run tests with Allure
        run: pytest -s --alluredir=allure-results
      
      - name: Debug for Allure results
        if: always()
        run: |
          echo "=== Allure results ==="
          ls -la allure-results
          echo "=== Result files ==="
          find allure-results -type f
    
      - name: Configure Allure environment
        if: always()
        run: |
            cat > allure-results/environment.properties << EOF
            execution = GitHub Actions
            os_platform = Linux
            os_version = Ubuntu
            python_version = $(python --version)
            browser = Chrome
            EOF
      
      - name: Configure Allure executor
        if: always()
        run: |
          cat > allure-results/executor.json << EOF
          {
            "reportName": "GitHub Actions Allure Report",
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "Run #${{ github.run_number }}",
            "buildOrder": ${{ github.run_number }},
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - name: Generate Allure report
        if: always()
        run: allure generate allure-results -o allure-report --clean

      - name: Save Allure history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: allure-report/history
          key: allure-history-${{ github.ref_name }}-${{ github.run_number }}
      
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
      
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report

  deploy:
    needs: test
    if: always()

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy Allure Report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

